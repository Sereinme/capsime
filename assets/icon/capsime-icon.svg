<?xml version="1.0" encoding="UTF-8"?>
<!--
  capsime 托盘图标设计图（设计参考；可用 VectorCraft / Inkscape 继续编辑）。

  图形是一个"变形 C"：CapsLock 的 C。
    · 圆环主体是几何的（印刷／拉丁字母）；
    · 环的下端顺势扫出一笔由粗到细的收锋，染作朱砂红（传统印泥色 = 中文书写的意象）；
    · 上端保持几何圆头横切。16px 下它仍然是个干净的 C。

  材质参考 Apple 应用图标：超椭圆 squircle 底、竖向渐变 + 顶部径向柔光、顶缘高光、
  图形底下压一层偏移的深色副本当柔和投影；两套主题跟随系统（亮色 = 纸白底墨字，
  暗色 = 靛蓝底白字，朱砂收锋两侧都用）。暂停态整套转冷灰。

  上排 = 启用（亮 / 暗），下排 = 暂停（亮 / 暗）。
  几何与 src/icon.rs 同源。
-->
